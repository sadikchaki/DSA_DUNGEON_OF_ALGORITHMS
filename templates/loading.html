<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Loading...</title>

<style>

body{

    margin:0;

    background:#111;

    color:white;

    font-family:Arial;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

.box{

    width:600px;

    text-align:center;

}

h1{

    font-size:50px;

}

#tip{

    margin-top:30px;

    font-size:22px;

    color:#f7d354;

}

.progress{

    width:100%;

    height:30px;

    border:3px solid white;

    margin-top:40px;

}

.bar{

    width:0%;

    height:100%;

    background:#2ecc71;

    transition:width .05s linear;

}

</style>

</head>

<body>

<div class="box">

<h1 id="title">

Loading...

</h1>

<div class="progress">

<div
class="bar"
id="bar">

</div>

</div>

<p id="tip">

Loading Dungeon...

</p>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const level = params.get("level");

let title = "Loading...";
let tip = "";
let next = "/levels";

// ==========================
// LEVEL 2
// ==========================

if(level == "2"){

    title = "Loading Level 2";

    tip = "Tip: Binary Search works only on sorted arrays.";

    next = "/game/2";

}

// ==========================
// LEVEL 3
// ==========================

else if(level == "3"){

    title = "Loading Level 3";

    tip = "Tip: Bubble Sort repeatedly swaps adjacent elements.";

    next = "/game/3";

}

// ==========================
// BOSS
// ==========================

else if(level == "boss"){

    title = "Loading Boss Battle";

    tip = "Final Challenge! All DSA topics will be tested.";

    next = "/game/4";

}

document.getElementById("title").innerHTML = title;
document.getElementById("tip").innerHTML = tip;

let progress = 0;

const bar = document.getElementById("bar");

const interval = setInterval(() => {

    progress++;

    bar.style.width = progress + "%";

    if(progress >= 100){

        clearInterval(interval);

        window.location.href = next;

    }

},20);

</script>

</body>

</html>
